connections {
    site1-site2 {
        # Indirizzo IP locale (CE1) da cui parte la VPN
        local_addrs = 203.0.113.2
        
        # Indirizzo IP remoto (CE2) a cui collegarsi
        remote_addrs = 203.0.113.6

        # Configurazione dell'autenticazione per il nodo locale
        local {
            auth = psk    # Tipo di autenticazione: Pre-Shared Key
            id = site1    # Identificativo univoco del nodo locale per la negoziazione
        }

        # Configurazione dell'autenticazione per il nodo remoto
        remote {
            auth = psk    # Richiede l'autenticazione tramite Pre-Shared Key anche dal nodo remoto
            id = site2    # Identificativo univoco atteso dal router remoto
        }

        # Blocco che definisce i parametri di cifratura per il traffico dati effettivo
        children {
            net-net {
                local_ts = 10.10.1.0/24     # Traffic Selector Locale: la rete LAN del Site 1
                remote_ts = 172.16.20.0/24  # Traffic Selector Remoto: la rete LAN del Site 2
                
                # Intervallo di tempo (in secondi) dopo il quale la chiave di cifratura dati viene rinnovata (5400 = 90 minuti)
                rekey_time = 5400
                
                # Proposta di cifratura per il protocollo ESP (traffico dati):
                esp_proposals = aes128gcm128-x25519
                start_action = start
            }
        }

        version = 2
        
        # Proposta per la negoziazione del canale di controllo:
        proposals = aes128-sha256-x25519
    }
}

# Sezione contenente le credenziali d'accesso e le chiavi segrete
secrets {
    ike-1 {
        id-1 = site1    # ID del nodo locale
        id-2 = site2    # ID del nodo remoto
        
        # La chiave Pre-Shared 
        secret = 0x536F6E6F556E6150617373776F726453696375726131313F3F2121
    }
}
